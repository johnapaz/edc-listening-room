name: Companion browser checks
on:
  pull_request:
    paths:
      - 'companion/**'
      - 'listening-room/**'
      - 'tests/ui_smoke.js'
      - 'data/edco-2026/**'
      - 'scripts/build*'
      - 'scripts/validate_current_lineup.py'
      - 'tests/companion*'
      - '.github/workflows/companion-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/build_companion_preview.py
      - name: Install test-only browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/companion-browser" playwright@1.62.1
          "$RUNNER_TEMP/companion-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Run browser acceptance (no hosting or provider calls)
        env:
          NODE_PATH: ${{ runner.temp }}/companion-browser/node_modules
        run: node tests/companion_smoke.js
      - name: Listening Room browser acceptance
        env:
          NODE_PATH: ${{ runner.temp }}/companion-browser/node_modules
          BASE: http://127.0.0.1:8765/listening-room/
          STUB_THUMBS: "1"
        run: |
          python3 scripts/build_public_site.py
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public-site > "$RUNNER_TEMP/listening-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/ui_smoke.js
      - name: Save sanitized review build (not a deployment)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: companion-review-build-${{ github.sha }}
          path: companion-preview/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-browser-evidence
          path: companion-evidence/
